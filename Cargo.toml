[workspace]
resolver = "2"
members = [
    "crates/oxidase",
    "crates/oxidase-macro",
]
exclude = [
    "crates/oxidase-native-runner",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/techton7/oxidase"
authors = ["Techton <contact@techton.io>"]

[workspace.dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "devtools", "document", "hooks", "signals", "macro", "html"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
heck = "0.5"
swc_core = { version = "78.0", features = ["common", "ecma_parser", "ecma_ast", "ecma_visit", "ecma_codegen", "ecma_transforms_typescript"] }

[patch.crates-io]
blitz-shell = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.2" }
blitz-dom = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.2" }
blitz-traits = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.2" }
blitz-paint = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.2" }

