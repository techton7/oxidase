[package]
name = "oxidase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "High-performance browser FFI runtime engine for Dioxus"
readme = "../../README.md"

[dependencies]
oxidase-macro = { path = "../oxidase-macro", version = "0.1.3" }

dioxus.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "DomRect",
    "Performance",
] }
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blitz-dom = { version = "0.3.0-beta.2", optional = true }
blitz-shell = { version = "0.3.0-beta.2", optional = true }
anyrender_vello = { version = "0.14.0", optional = true }

[features]
default = []
native = ["dep:blitz-dom", "dep:blitz-shell", "dep:anyrender_vello"]

