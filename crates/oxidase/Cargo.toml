[package]
name = "oxidase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "High-performance browser FFI runtime engine for Dioxus"
readme = "../../README.md"

[dependencies]
oxidase-macro = { path = "../oxidase-macro", version = "0.2.0" }
oxidase-floating-ui = { path = "../oxidase-floating-ui", version = "0.2.0" }

dioxus.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
futures-timer.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "HtmlFormElement",
    "Node",
    "DomRect",
    "Performance",
    "EventTarget",
    "Event",
    "PointerEvent",
    "KeyboardEvent",
    "FocusEvent",
    "AnimationEvent",
    "TransitionEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "AddEventListenerOptions",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blitz-dom = { version = "0.3.0-beta.4", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.6", optional = true }
blitz-shell = { version = "0.3.0-beta.4", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.6", optional = true }
blitz-traits = { version = "0.3.0-beta.4", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.6", optional = true }
anyrender_vello = { version = "0.15.0", optional = true }
blitz-host = { version = "0.2.0", git = "https://github.com/techton7/blitz-host.git", tag = "blitz-host-v0.2.0", features = ["dioxus-native"], optional = true }
dioxus-native = { version = "0.7.0", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.2.6", optional = true }


[features]
default = []
native = ["dep:blitz-dom", "dep:blitz-shell", "dep:blitz-traits", "dep:anyrender_vello", "dep:dioxus-native"]
blitz-host = ["native", "dep:blitz-host"]

