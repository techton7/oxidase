[package]
name = "oxidase-floating-ui"
description = "Pure Rust geometric engine and positioning substrate for Oxidase (Floating UI port)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "DomRect",
    "CssStyleDeclaration",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blitz-dom = { version = "0.3.0-beta.2", git = "https://github.com/techton7/blitz.git", tag = "techton-main-v0.1.0" }

[dev-dependencies]
serde_json = { workspace = true }
