[package]
name = "oxidase-native-runner"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Internal native test runner for oxidase"
publish = false

# NOTE: oxidase-native-runner is an internal test harness (`publish = false`).
# It intentionally consumes in-tree `oxidase` via `path = "../oxidase"` and local
# monorepo workspace patches. This enables immediate, zero-latency testing of engine
# changes without requiring circular git-tag publishing loops.
#
# For the canonical, standalone cross-host consumer example, see:
# `crates/oxidase/examples/cross_host/main.rs`.

[dependencies]
oxidase = { version = "0.1.5", path = "../oxidase", features = ["native", "blitz-host"] }
dioxus-native = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.1" }
blitz-dom = { version = "0.3.0-beta.2", default-features = false }
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "devtools", "document", "hooks", "signals", "macro", "html"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[patch."https://github.com/techton7/blitz-host.git"]
blitz-host = { path = "../../../blitz-host/crates/blitz-host" }
blitz-host-protocol = { path = "../../../blitz-host/crates/blitz-host-protocol" }
blitz-host-transport = { path = "../../../blitz-host/crates/blitz-host-transport" }
blitz-host-bridge = { path = "../../../blitz-host/crates/blitz-host-bridge" }

[patch."https://github.com/techton7/blitz.git"]
dioxus-native = { path = "../../../../blitz/packages/dioxus-native" }
dioxus-native-dom = { path = "../../../../blitz/packages/dioxus-native-dom" }
blitz-shell = { path = "../../../../blitz/packages/blitz-shell" }
blitz-dom = { path = "../../../../blitz/packages/blitz-dom" }
blitz-traits = { path = "../../../../blitz/packages/blitz-traits" }
blitz-paint = { path = "../../../../blitz/packages/blitz-paint" }

[patch.crates-io]
blitz-shell = { path = "../../../../blitz/packages/blitz-shell" }
blitz-dom = { path = "../../../../blitz/packages/blitz-dom" }
blitz-traits = { path = "../../../../blitz/packages/blitz-traits" }
blitz-paint = { path = "../../../../blitz/packages/blitz-paint" }

