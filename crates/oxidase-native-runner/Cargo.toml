[package]
name = "oxidase-native-runner"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Internal native test runner for oxidase"
publish = false

[dependencies]
oxidase = { version = "0.1.4", path = "../oxidase", features = ["native"] }
dioxus-native = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.1" }
blitz-dom = { version = "0.3.0-beta.2", default-features = false }
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "devtools", "document", "hooks", "signals", "macro", "html"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[patch.crates-io]
blitz-shell = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.1" }
blitz-dom = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.1" }
blitz-traits = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.1" }
blitz-paint = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.1" }

