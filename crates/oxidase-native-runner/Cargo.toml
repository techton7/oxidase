[package]
name = "oxidase-native-runner"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Internal native test runner for oxidase"
publish = false

# NOTE: oxidase-native-runner is an internal test harness (`publish = false`).
# It intentionally consumes in-tree `oxidase` via `path = "../oxidase"` and local
# monorepo workspace patches. This enables immediate, zero-latency testing of engine
# changes without requiring circular git-tag publishing loops.
#
# For the canonical, standalone cross-host consumer example, see:
# `crates/oxidase/examples/cross_host/main.rs`.

[dependencies]
oxidase = { version = "0.1.6", path = "../oxidase", features = ["native", "blitz-host"] }
dioxus-native = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.2" }
blitz-dom = { version = "0.3.0-beta.2", default-features = false }
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "devtools", "document", "hooks", "signals", "macro", "html"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[patch.crates-io]
blitz-shell = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.2" }
blitz-dom = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.2" }
blitz-traits = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.2" }
blitz-paint = { git = "https://github.com/techton7/blitz.git", tag = "v0.3.0-alpha.2" }

# Keep oxidase-native-runner in debug mode (opt-level = 0, full debuginfo)
# while compiling all external dependencies (vello, wgpu, stylo, blitz) with opt-level = 3
[profile.dev.package."*"]
opt-level = 3

